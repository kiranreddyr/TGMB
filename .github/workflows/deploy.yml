name: Deploy

# Rebuilds the site and republishes it to GitHub Pages: on every push to
# main (code changes), on an hourly schedule (fresh weather data — this is
# the "scheduler" from PRD section 7), and on-demand via the Actions tab.
#
# No secrets are used anywhere in this workflow. The Open-Meteo forecast
# API is keyless for non-commercial use (PRD section 5) and is only ever
# called from this server-side job — the browser never talks to it
# directly, it only ever fetches the static JSON this job produces.

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install pipeline dependencies
        run: npm install

      - name: Install web app dependencies
        run: npm install
        working-directory: web

      - name: Fetch weather and build the data payload
        run: npm run hourly-job

      - name: Copy payload into the web app
        run: npm run sync-web-data

      - name: Build static site
        run: npm run build
        working-directory: web
        env:
          NEXT_PUBLIC_BASE_PATH: /TGMB

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
